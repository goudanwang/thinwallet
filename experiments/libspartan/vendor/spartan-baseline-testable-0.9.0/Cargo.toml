[dependencies.merlin]
version = "3.0.0"
default-features = false

[dependencies.rand]
version = "0.8"

[dependencies.rand_core]
version = "0.6"
features = ["getrandom"]
default-features = false

[dependencies.rayon]
version = "1.3.0"
optional = true

[dependencies.serde]
version = "1.0.106"
features = ["derive"]
