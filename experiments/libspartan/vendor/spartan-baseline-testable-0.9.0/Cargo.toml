[package]
edition = "2021"
name = "spartan-baseline-testable"
version = "0.9.0"
authors = ["Srinath Setty <srinath@microsoft.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-speed zkSNARKs without trusted setup"
documentation = "https://docs.rs/spartan/"
readme = "README.md"
keywords = [
    "zkSNARKs",
    "cryptography",
    "proofs",
]
license-file = "LICENSE"
repository = "https://github.com/microsoft/Spartan"

[lib]
name = "libspartan"
