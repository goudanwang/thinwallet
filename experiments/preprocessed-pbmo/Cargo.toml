[package]
name = "preprocessed-pbmo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
bincode = "1.3"
chacha20poly1305 = "0.10"
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "rand_core", "serde"] }
hmac = "0.12"
fs2 = "0.4"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
thinwallet-instrumentation = { path = "../thinwallet-instrumentation", optional = true }

[features]
default = []
thinwallet-experiment = ["thinwallet-instrumentation"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "phase_v2_pbmo"
path = "src/bin/phase_v2_pbmo.rs"

[[bin]]
name = "transport_rejection_probe"
path = "src/bin/transport_rejection_probe.rs"

[[bin]]
name = "phase3_pbmo_microbench"
path = "src/bin/phase3_pbmo_microbench.rs"
